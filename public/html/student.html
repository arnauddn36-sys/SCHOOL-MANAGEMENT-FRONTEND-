<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Élève — School Management</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/student.css">

</head>

<body>

    <header class="student-header">
        <h1>Dashboard Élève</h1>
        <button id="logout">Déconnexion</button>
    </header>

    <main>

        <!-- Fiche d'identité de l'élève -->
        <section class="student-info">

            <h2>Bonjour <span id="student-name">Élève</span></h2>

            <div class="student-identity">

                <div>
                    <span class="label">Nom</span>
                    <span class="value" id="info-nom">---</span>
                </div>

                <div>
                    <span class="label">Prénom</span>
                    <span class="value" id="info-prenom">---</span>
                </div>

                <div>
                    <span class="label">Classe</span>
                    <span class="value" id="info-classe">---</span>
                </div>

                <div>
                    <span class="label">Matricule</span>
                    <span class="value" id="info-matricule">---</span>
                </div>

            </div>

        </section>

        <!-- Tableau des notes -->
        <section class="grades">

            <h2>Mes notes</h2>

            <table>
                <thead>
                    <tr>
                        <th>Matière</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody id="gradesBody">
                    <tr><td colspan="2">Chargement...</td></tr>
                </tbody>
            </table>

        </section>

        <!-- Tableau des absences -->
        <section class="absences">

            <h2>Mes absences</h2>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="absencesBody">
                    <tr><td colspan="2">Chargement...</td></tr>
                </tbody>
            </table>

        </section>

    </main>

    <script type="module" src="../js/student.js"></script>

</body>

</html>
